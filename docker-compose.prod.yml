services:
  db:
    image: mysql:8.4
    container_name: cbt-db-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-cbt}
      MYSQL_USER: ${DB_USERNAME:-cbt}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      # Volume yang sama dengan stack dev, data tidak hilang saat pindah mode.
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: cbt-laravel-inertia-react:prod
    container_name: cbt-app-prod
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - cbt-vendor-prod:/app/vendor
      - cbt-node-modules-prod:/app/node_modules
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://192.168.8.116}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cbt}
      DB_USERNAME: ${DB_USERNAME:-cbt}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    command:
      - sh
      - -c
      - |
        php artisan queue:work --tries=3 --sleep=3 --memory=128 &
        exec php-fpm

  nginx:
    image: nginx:1.27-alpine
    container_name: cbt-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  cbt-vendor-prod:
  cbt-node-modules-prod:
